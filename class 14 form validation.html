<html lang="en">
<head>

    <title>Register</title>
    <link rel="stylesheet" type="text/css" href="class 14 form validation.css">
</head>
<body>
   <div style="margin-top: 40px;"  class="used_area">
        <br><h1 class="h1">REGISTER HERE</h1><br><br>

        <form onsubmit="return validate()" action="success class 14 .html">
            <input type="text" id="uname" placeholder="Username" class="box1"><br><br>
            <input type="email" id="email" placeholder="Email" class="box1"><br><br>
            <input type="password" id="pass1" placeholder="Password" class="box1"><br><br>
            <input type="password" id="pass2" placeholder="Confirm Password" class="box1"><br><br>
            <input type="text" id="mobile" placeholder="Contact" class="box1"><br><br>
            <h2 id="error"></h2><br>
            <button id="btn1" onclick="validate()"><b>REGISTER</b></button><br><br>
        </form>
    
        
    </div>
