<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Air ticket Booking website</title>
    <link rel="stylesheet" href="style.css">
</head>
    
<body>

    
   
    <img src="logo.png" alt="logo" width="50% ;"><br><br>
    
    <h1><b><i>Air ticket Booking</i></b></h1><br><br>
    
    <form action="class 7 (2) .project.html">
        <label style="font-family: Verdana;">Username</label><br>
        <br><input type="text" class="box1" id="fname" name="fname" placeholder="First name"><br>
        <br><input type="text" class="box1" id="lname" name="lname" placeholder="Last name"><br>

        <br><br><label style="font-family: Verdana;" >Email Address</label>
        <br><br><input type="email" class="box1" id="email" name="email" placeholder="Email"><br><br>
        <br><br><label style="font-family: Verdana;">Password</label><br>
       <br><input type="password" class="box1" id="Password" name="Password" placeholder="Password"><br>
       <br><br><label style="font-family: Verdana;">Phone Number</label><br>
        <br><input type="number" class="box1" id="number" name="number" placeholder="Contact "><br>
        
        <br><br><br><h3><b>Gender</b></h3><br>
        <input type="radio" class="Gender" name="Gender" value="male">
        <label style="font-family: Verdana;"> <b>Male</b></label>
        <input type="radio" class="Gender" name="Gender" value="female">
        <label style="font-family: Verdana;"> <b>Female</b></label><br><br>

        <br><br><h3> <b>Choose Meal ( Any Three )</b> </h3><br>
        <input type="checkbox" class="Meal" name="Choose Meal" value="rice">
        <label style="font-family: Verdana;"><b>Rice</b> </label>
        <input type="checkbox" class="Meal" name="Choose Meal" value="beef">
        <label style="font-family: Verdana;"> <b>Beef</b></label>
        <input type="checkbox" class="Meal" name="Choose Meal" value="chicken">
        <label style="font-family: Verdana;"><b>chicken</b> </label>
        <input type="checkbox" class="Meal" name="Choose Meal" value="pepsi">
        <label style="font-family: Verdana;"><b>Mojo</b></label>
        <input type="checkbox" class="Meal" name="Choose Meal" value="clemon">
        <label style="font-family: Verdana;"><b>Clemon</b></label><br><br><br>
        <br><br><label style="font-family: Verdana; font-size: 20px;"><b>Boarding Form</b> </label>
        
        <br><br><select name="boarding" class="boarding" >
            
            <option>Choose</option>
            <option  value="Dhaka">Dhaka</option>
            <option  value="Chittagong">Chittagong</option>
            <option  value="Cox's Bazar">Cox's Bazar</option>
            <option  value="Sylhet">Sylhet</option>
            <option  value="Rajshahi">Rajshahi</option>
            <option  value="Saidpur">Saidpur</option>
        </select><br><br>
        <br><br><label style="font-family: Verdana; font-size: 20px;"><b>Destination</b></label>

        <br><br><select name="destination" class="destination" >
            
            <option>Choose</option>
            <option  value="Dhaka">Dhaka</option>
            <option  value="Chittagong">Chittagong</option>
            <option  value="Cox's Bazar">Cox's Bazar</option>
            <option  value="Sylhet">Sylhet</option>
            <option  value="Rajshahi">Rajshahi</option>
            <option  value="Saidpur">Saidpur</option>
        </select><br><br>





        <br><br><br><button>Submit</button> <br><br><br>
        
    </form>
    
</body>
</html>
